on:
  workflow_call:

jobs:
  release:
    name: "Release"
    if: contains(github.ref, 'refs/tags/release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        id: download
        uses: actions/download-artifact@v3
        with:
          name: embedded-app-${{ github.sha }}-IDFv5.1
          path: build

      - name: Create release
        run: |
          TAG_NAME="${{ github.ref }}"
          VERSION=${TAG_NAME#refs/tags/release/v}
          curl -X POST 'https://api.sindarin.com/firmware/' \
          -H "Authorization: Tolkien ${{ secrets.SOL_AUTH_TOLKIEN }}" \
          -F "version=$VERSION" \
          -F "file=@${{ steps.download.outputs.download-path }}/embedded-app.bin;type=application/octet-stream" \
          -F "elf=@${{ steps.download.outputs.download-path }}/embedded-app.elf;type=application/octet-stream" \
          -F "role=DEBUG" \
          -F "device=GLASSES" \
          -F "release_notes=TODO"

      - name: Zip back up the build
        run: zip -r embedded-app-${{ github.sha }}-IDFv5.1.zip build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: embedded-app-${{ github.sha }}-IDFv5.1.zip

      - name: Notify Slack
        run: |
          TAG_NAME="${{ github.ref }}"
          VERSION=${TAG_NAME#refs/tags/release/v}
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"New release $VERSION has been uploaded. See it at https://api.sindarin.com/admin/devices/firmwaredownload/\"}" \
          ${{ secrets.SLACK_WEBHOOK_URL }}
